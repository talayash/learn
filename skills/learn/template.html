<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F6F3;
  --sheet: #FFFFFF;
  --ink: #171B21;
  --muted: #5E6570;
  --rule: #E3E4DF;
  --mark: #F5DC4E;
  --mark-ink: #171B21;
  --line: #2F6F73;
  --tint: #E6F0F0;
  --good: #2E7D4F;
  --bad: #B23A3A;
  --measure: 44rem;
  --wide: 62rem;
  --radius: 10px;
  --sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121519; --sheet: #1A1E24; --ink: #E7E9EC; --muted: #99A1AB; --rule: #2A3038;
    --mark: #8A7714; --mark-ink: #FFF8D6; --line: #6FB7BA; --tint: #1C2B2D; --good: #6CC58F; --bad: #EE8A8A;
  }
}
:root[data-theme="dark"] {
  --paper: #121519; --sheet: #1A1E24; --ink: #E7E9EC; --muted: #99A1AB; --rule: #2A3038;
  --mark: #8A7714; --mark-ink: #FFF8D6; --line: #6FB7BA; --tint: #1C2B2D; --good: #6CC58F; --bad: #EE8A8A;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.0625rem/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: var(--mono); font-size: .85em; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; border-radius: 4px; }

/* The highlighter: the one loud thing on the page. */
mark, .hl {
  background: linear-gradient(104deg, transparent .3em, var(--mark) .3em, var(--mark) calc(100% - .25em), transparent calc(100% - .25em)) 0 62% / 100% 58% no-repeat;
  color: inherit;
  padding: 0 .15em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark, :root:not([data-theme="light"]) .hl { color: var(--mark-ink); } }
:root[data-theme="dark"] mark, :root[data-theme="dark"] .hl { color: var(--mark-ink); }

/* Top bar: section pills and reading progress */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar-inner {
  display: flex; align-items: center; gap: 1rem;
  max-width: var(--wide); margin: 0 auto; padding: .55rem 1rem;
}
.topbar .home { color: var(--muted); text-decoration: none; font-size: .9rem; white-space: nowrap; }
.topbar .home:hover { color: var(--ink); }
nav.toc {
  flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none;
  /* Fade the edges so pills cut off by the scroll read as "more this way" */
  -webkit-mask-image: linear-gradient(to right, transparent, #000 1rem, #000 calc(100% - 1rem), transparent);
  mask-image: linear-gradient(to right, transparent, #000 1rem, #000 calc(100% - 1rem), transparent);
}
nav.toc::-webkit-scrollbar { display: none; }
nav.toc ol { display: flex; gap: .35rem; list-style: none; margin: 0; padding: 0 1rem; }
nav.toc ol a {
  display: block; white-space: nowrap; padding: .3rem .75rem; border-radius: 999px;
  color: var(--muted); text-decoration: none; font-size: .88rem;
}
nav.toc ol a:hover { color: var(--ink); background: var(--sheet); }
nav.toc ol a.active { color: var(--ink); background: var(--mark); }
:root[data-theme="dark"] nav.toc ol a.active { color: var(--mark-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav.toc ol a.active { color: var(--mark-ink); } }
#theme {
  background: none; border: 1px solid var(--rule); color: var(--muted); font: inherit; font-size: .85rem;
  padding: .25rem .65rem; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.progress { height: 3px; }
.progress span { display: block; height: 100%; width: 0; background: var(--line); }

main { max-width: var(--measure); margin: 0 auto; padding: 2.5rem 1rem 5rem; }
main > section.wide { max-width: var(--wide); width: min(var(--wide), calc(100vw - 2rem)); margin-left: 50%; transform: translateX(-50%); }

/* Hero */
header.hero { padding-bottom: 1.5rem; }
.kicker { color: var(--muted); font-size: .9rem; margin: 0 0 .6rem; letter-spacing: .02em; }
.kicker b { color: var(--ink); font-weight: 600; }
.hero h1 {
  font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.08;
  letter-spacing: -.02em; margin: 0 0 1.5rem; text-wrap: balance;
}
ol.takeaways { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; counter-reset: tk; }
ol.takeaways li {
  counter-increment: tk; display: grid; grid-template-columns: 2rem 1fr; gap: .6rem; align-items: start;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: .8rem 1rem; font-size: 1.08rem; line-height: 1.5;
}
ol.takeaways li::before {
  content: counter(tk); display: grid; place-items: center; width: 1.75rem; height: 1.75rem;
  border-radius: 50%; background: var(--tint); color: var(--line); font-weight: 800; font-size: .9rem;
}
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.chips span { font-size: .82rem; padding: .2rem .65rem; border-radius: 999px; background: var(--tint); color: var(--ink); }

.callout {
  margin: 1.25rem 0 0; padding: 1rem 1.2rem; background: var(--sheet);
  border: 1px solid var(--rule); border-left: 4px solid var(--mark); border-radius: var(--radius);
}
.callout .label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .3rem; }
.callout p { margin: 0; font-size: 1.05rem; }

/* Sections */
section { padding: 2.25rem 0 .5rem; border-top: 1px solid var(--rule); margin-top: 1.5rem; }
.eyebrow { font-family: var(--mono); font-size: .78rem; color: var(--line); margin: 0 0 .25rem; }
h2 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 1rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.12rem; margin: 1.5rem 0 .5rem; line-height: 1.3; }
h4 { margin: 1rem 0 .3rem; font-size: .95rem; }
p { margin: 0 0 1rem; }
.lead { color: var(--muted); margin-top: -.4rem; }

details.more { margin-top: 1rem; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
details.more > summary:hover { color: var(--ink); }
details.more[open] > summary { margin-bottom: .5rem; }

.files { list-style: none; padding: 0; margin: 0; }
.files li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: .4rem; padding: .4rem 0; border-top: 1px solid var(--rule); font-size: .95rem; }
.files .sign { font-family: var(--mono); font-weight: 600; text-align: center; }
.files .added { color: var(--good); } .files .deleted { color: var(--bad); } .files .modified { color: var(--muted); }
.files .path { word-break: break-all; }
.files .role { display: block; color: var(--muted); font-size: .9rem; }

figure.diagram {
  margin: 0 0 1rem; padding: 1.25rem; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--radius); overflow-x: auto;
}
figure.diagram .mm { display: flex; justify-content: center; min-height: 3rem; }
figure.diagram svg { max-width: 100%; height: auto; }
.mm-error { font-size: .85rem; color: var(--bad); }
.mm-error pre { color: var(--ink); white-space: pre-wrap; background: var(--paper); padding: .75rem; border-radius: 4px; }

ol.steps { padding-left: 1.4rem; margin: 0 0 1rem; }
ol.steps li { padding-left: .3rem; margin-bottom: .3rem; }
ul.notes { padding-left: 1.2rem; margin: 0 0 1rem; }
ul.notes li { margin-bottom: .25rem; }

/* Card grids: patterns and terms */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .9rem; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1.1rem 1.2rem; min-width: 0; }
.pattern h3 { margin: 0 0 .1rem; font-size: 1.2rem; }
.pattern .cat { color: var(--muted); font-size: .85rem; margin-bottom: .7rem; }
.pattern p { font-size: .98rem; margin-bottom: .6rem; }
.pattern .label { font-weight: 600; }
.where { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 .75rem; }
.where a, .where span {
  font-family: var(--mono); font-size: .76rem; padding: .15rem .5rem;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); text-decoration: none; word-break: break-all;
}
.where a:hover { border-color: var(--line); }
.tradeoffs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: .92rem; }
.tradeoffs h4 { margin: 0 0 .2rem; font-size: .9rem; }
.tradeoffs ul { margin: 0; padding-left: 1.1rem; }
.tradeoffs .gain h4 { color: var(--good); } .tradeoffs .cost h4 { color: var(--bad); }
.term dt { font-weight: 800; margin-bottom: .25rem; }
.term dd { margin: 0; font-size: .97rem; }

table { width: 100%; border-collapse: collapse; font-size: .95rem; margin-bottom: 1rem; }
th, td { text-align: left; padding: .5rem .6rem .5rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .85rem; }
.table-wrap { overflow-x: auto; }

details.q { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); padding: .75rem 1rem; margin-bottom: .6rem; }
details.q summary { cursor: pointer; font-weight: 600; }
details.q p { margin: .6rem 0 0; }

.quiz-item { margin-bottom: 1.5rem; }
.quiz-item .qtext { font-weight: 600; margin-bottom: .55rem; }
.quiz-item .opts { display: grid; gap: .4rem; }
.quiz-item button.opt {
  text-align: left; font: inherit; font-size: .98rem; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: .6rem .9rem; cursor: pointer;
}
.quiz-item button.opt:hover:not(:disabled) { border-color: var(--line); }
.quiz-item button.opt:disabled { cursor: default; }
.quiz-item button.opt.right { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.quiz-item button.opt.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.quiz-item .why { margin-top: .5rem; font-size: .95rem; }
.score { color: var(--muted); font-size: .95rem; }

.snippet { margin: 0 0 1rem; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); overflow: hidden; }
.snippet figcaption { padding: .55rem .9rem; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; font-size: .9rem; }
.snippet pre { margin: 0; padding: .9rem 1rem; overflow-x: auto; tab-size: 2; line-height: 1.55; background: var(--paper); }
.snippet .explanation { padding: .7rem .9rem; margin: 0; border-top: 1px solid var(--rule); font-size: .97rem; }

.challenge { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.challenge h3 { margin-top: 0; }
.challenge details.q { background: var(--paper); }
.hint-button { font: inherit; font-size: .92rem; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: .35rem .9rem; cursor: pointer; margin-bottom: .9rem; }
.hint-button:disabled { color: var(--muted); cursor: default; }

ul.resources { list-style: none; padding: 0; margin: 0; }
ul.resources li { padding: .55rem 0; border-top: 1px solid var(--rule); }
ul.resources a { font-weight: 600; }
ul.resources .kind { color: var(--muted); font-size: .85rem; margin-left: .5rem; }

footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .85rem; }

@media (max-width: 640px) {
  .topbar .home { display: none; }
  .tradeoffs { grid-template-columns: 1fr; gap: .6rem; }
  figure.diagram { padding: 1rem .75rem; }
  /* Keep diagrams legible on phones: natural size, scroll sideways inside the frame */
  figure.diagram .mm { justify-content: flex-start; }
  figure.diagram svg { max-width: none !important; min-width: 34rem; }
}
@media print {
  .topbar { display: none; }
  details.more, details.q { display: block; }
  figure.diagram, .card, .challenge { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="home" href="index.html">&larr; All lessons</a>
    <nav class="toc" aria-label="Lesson sections"><ol id="toc"></ol></nav>
    <button id="theme" type="button">Theme: auto</button>
  </div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</header>
<main id="app"></main>

<script id="lesson-data" type="application/json">/*__LEARN_DATA__*/null</script>
<script type="module">
const raw = document.getElementById("lesson-data").textContent;
const L = JSON.parse(raw === "/*__LEARN_DATA__*/null" ? "null" : raw);
const app = document.getElementById("app");

// Every piece of lesson text goes through textContent. Nothing from the JSON is parsed as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const has = (a) => Array.isArray(a) && a.length > 0;
const text = (tag, s, attrs) => h(tag, { dir: "auto", ...(attrs || {}) }, s);
const more = (label, ...kids) => h("details", { class: "more" }, h("summary", null, label), kids);

// Theme toggle: auto -> light -> dark. Stored per viewer, page works without it.
const themeBtn = document.getElementById("theme");
const modes = ["auto", "light", "dark"];
function applyTheme(m) {
  if (m === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", m);
  themeBtn.textContent = "Theme: " + m;
}
let theme = "auto";
try { theme = localStorage.getItem("learn-theme") || "auto"; } catch {}
applyTheme(theme);
themeBtn.addEventListener("click", () => {
  theme = modes[(modes.indexOf(theme) + 1) % modes.length];
  try { localStorage.setItem("learn-theme", theme); } catch {}
  applyTheme(theme);
  renderDiagrams();
});

if (!L) {
  app.append(h("header", { class: "hero" }, h("h1", null, "No lesson data"),
    h("p", null, "This is the raw template. Run /learn in Claude Code, or node render.mjs <lesson.json>, to generate a lesson.")));
  throw new Error("no lesson data");
}

document.title = L.title;

// Reading time counts prose only: code and diagram source are skimmed, not read.
function words(v, key) {
  if (["code", "mermaid", "erMermaid", "url", "path", "root", "generatedAt"].includes(key)) return 0;
  if (typeof v === "string") return v.split(/\s+/).filter(Boolean).length;
  if (Array.isArray(v)) return v.reduce((n, x) => n + words(x), 0);
  if (v && typeof v === "object") return Object.entries(v).reduce((n, [k, x]) => n + words(x, k), 0);
  return 0;
}
const minutes = Math.max(1, Math.round(words(L) / 220));

const sections = [];
function section(id, title, body, opts = {}) {
  if (!body) return;
  sections.push({ id, title });
  const n = String(sections.length).padStart(2, "0");
  app.append(h("section", { id, class: opts.wide ? "wide" : null },
    h("p", { class: "eyebrow", "aria-hidden": "true" }, n), h("h2", null, title), body));
}

function diagram(src) {
  if (!src) return null;
  return h("figure", { class: "diagram" }, h("div", { class: "mm", "data-src": src }));
}

function editorLink(ref) {
  const m = /^(.*?)(?::(\d+))?$/.exec(ref);
  if (!L.root || !m) return h("span", null, ref);
  const path = m[1].replace(/\\/g, "/").replace(/^\.?\//, "");
  const href = "vscode://file/" + encodeURI(L.root + "/" + path) + (m[2] ? ":" + m[2] : "");
  return h("a", { href, title: "Open in VS Code" }, ref);
}

function codeSnippet(s) {
  const end = s.startLine + s.code.replace(/\r?\n$/, "").split("\n").length - 1;
  return h("figure", { class: "snippet" },
    h("figcaption", null, editorLink(`${s.path}:${s.startLine}`),
      h("span", { class: "mono" }, ` · lines ${s.startLine}–${end}${s.language ? " · " + s.language : ""}`)),
    h("pre", { dir: "ltr" }, h("code", null, s.code)),
    text("p", s.explanation, { class: "explanation" }));
}

function fileList(files) {
  return h("ul", { class: "files" }, files.map((f) => {
    const c = ["added", "deleted"].includes(f.change) ? f.change : "modified";
    return h("li", null,
      h("span", { class: "sign " + c, "aria-label": c }, c === "added" ? "+" : c === "deleted" ? "x" : "~"),
      h("div", null, h("span", { class: "path mono" }, f.path), f.role ? text("span", f.role, { class: "role" }) : null));
  }));
}

/* Hero: kicker, title, numbered takeaways, 30-second pitch, collapsed file list */
const kicker = [h("span", null, "Lesson")];
if (L.level) kicker.push(" · ", h("span", null, "Level ", h("b", null, L.level)));
kicker.push(" · ", h("span", null, h("b", null, minutes), " min read"));
app.append(h("header", { class: "hero", id: "top" },
  h("p", { class: "kicker" }, kicker),
  text("h1", L.title),
  h("ol", { class: "takeaways" }, L.tldr.map((t) => text("li", t))),
  has(L.stack) ? h("div", { class: "chips" }, L.stack.map((s) => text("span", s))) : null,
  L.pitch ? h("div", { class: "callout" }, h("span", { class: "label" }, "Say it in 30 seconds"), text("p", L.pitch)) : null,
  has(L.files) ? more(`${L.files.length} file${L.files.length === 1 ? "" : "s"} that carry the change`, fileList(L.files)) : null));

/* Architecture */
if (L.architecture?.mermaid) {
  section("architecture", "How it fits together", h("div", null,
    diagram(L.architecture.mermaid),
    has(L.architecture.notes) ? h("ul", { class: "notes" }, L.architecture.notes.map((n) => text("li", n))) : null), { wide: true });
}

/* Flows */
if (has(L.flows)) {
  section("flows", "How a request moves", h("div", null, L.flows.map((f) => h("div", null,
    text("h3", f.name),
    diagram(f.mermaid),
    has(f.steps) ? h("ol", { class: "steps" }, f.steps.map((s) => text("li", s))) : null))), { wide: true });
}

/* Code excerpts */
if (has(L.snippets)) {
  section("code", "Key code", h("div", null, L.snippets.map(codeSnippet)));
}

/* Patterns */
if (has(L.patterns)) {
  section("patterns", "Patterns", h("div", { class: "grid" }, L.patterns.map((p) => h("article", { class: "card pattern" },
    h("h3", { dir: "auto" }, h("mark", null, p.name)),
    p.category ? text("div", p.category, { class: "cat" }) : null,
    p.what ? h("p", { dir: "auto" }, h("span", { class: "label" }, "Idea: "), p.what) : null,
    p.here ? h("p", { dir: "auto" }, h("span", { class: "label" }, "Here: "), p.here) : null,
    has(p.where) ? h("div", { class: "where" }, p.where.map(editorLink)) : null,
    has(p.snippets) ? p.snippets.map(codeSnippet) : null,
    p.tradeoffs && (has(p.tradeoffs.pros) || has(p.tradeoffs.cons)) ? more("Trade-offs", h("div", { class: "tradeoffs" },
      has(p.tradeoffs.pros) ? h("div", { class: "gain" }, h("h4", null, "Gain"), h("ul", null, p.tradeoffs.pros.map((x) => text("li", x)))) : null,
      has(p.tradeoffs.cons) ? h("div", { class: "cost" }, h("h4", null, "Cost"), h("ul", null, p.tradeoffs.cons.map((x) => text("li", x)))) : null)) : null))), { wide: true });
}

/* Data and cache */
const D = L.data;
if (D && (D.erMermaid || has(D.tables) || has(D.cache))) {
  section("data", "Data and cache", h("div", null,
    D.erMermaid ? diagram(D.erMermaid) : null,
    has(D.tables) ? h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Table"), h("th", null, "Why it exists"))),
      h("tbody", null, D.tables.map((t) => h("tr", null, h("td", { class: "mono" }, t.name), text("td", t.why || "")))))) : null,
    has(D.cache) ? h("div", null, h("h3", null, "Cache"), h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Key"), h("th", null, "TTL"), h("th", null, "Strategy"), h("th", null, "Why"))),
      h("tbody", null, D.cache.map((c) => h("tr", null,
        h("td", { class: "mono" }, c.key), h("td", null, c.ttl || ""), h("td", null, c.strategy || ""), text("td", c.why || ""))))))) : null), { wide: true });
}

/* Concepts */
if (has(L.concepts)) {
  section("concepts", "Key terms", h("div", { class: "grid" }, L.concepts.map((c) => h("dl", { class: "card term" },
    h("dt", { dir: "auto" }, h("mark", null, c.term)), text("dd", c.explain)))), { wide: true });
}

/* Quiz */
if (has(L.quiz)) {
  let right = 0, answered = 0;
  const score = h("p", { class: "score", "aria-live": "polite" }, `0 of ${L.quiz.length} answered`);
  const items = L.quiz.map((q, qi) => {
    const why = h("p", { class: "why", hidden: true, dir: "auto" });
    const buttons = q.options.map((o, oi) => h("button", { class: "opt", type: "button", dir: "auto", onclick: () => {
      buttons.forEach((b, bi) => {
        b.disabled = true;
        if (bi === q.answer) b.classList.add("right");
      });
      const ok = oi === q.answer;
      if (!ok) buttons[oi].classList.add("wrong");
      answered++; if (ok) right++;
      why.hidden = false;
      why.textContent = (ok ? "Correct. " : "Not quite. ") + (q.why || "");
      score.textContent = answered === L.quiz.length
        ? `You got ${right} of ${L.quiz.length}.`
        : `${answered} of ${L.quiz.length} answered`;
    } }, o));
    return h("div", { class: "quiz-item" }, text("div", `${qi + 1}. ${q.q}`, { class: "qtext" }), h("div", { class: "opts" }, buttons), why);
  });
  section("quiz", "Quick check", h("div", null, items, score));
}

/* Practical challenges: reveal one hint at a time, with a separate solution. */
if (has(L.challenges)) {
  section("challenges", "Try it yourself", h("div", null,
    L.challenges.map((c, i) => {
      let revealed = 0;
      const hints = h("ol", { id: `challenge-hints-${i}`, class: "steps", "aria-live": "polite" });
      const next = h("button", {
        type: "button", class: "hint-button", "aria-controls": hints.id,
        onclick: () => {
          hints.append(text("li", c.hints[revealed++]));
          next.textContent = revealed === c.hints.length ? "All hints revealed" : `Show hint ${revealed + 1} of ${c.hints.length}`;
          next.disabled = revealed === c.hints.length;
        },
      }, `Show hint 1 of ${c.hints.length}`);
      return h("article", { class: "challenge" },
        text("h3", `${i + 1}. ${c.title}`), text("p", c.task),
        has(c.where) ? h("div", { class: "where" }, c.where.map(editorLink)) : null,
        has(c.snippets) ? c.snippets.map(codeSnippet) : null,
        h("h4", null, "Done when"),
        h("ul", { class: "notes" }, c.checks.map((check) => text("li", check))),
        hints, next,
        h("details", { class: "q" }, h("summary", null, "Reveal solution"), text("p", c.solution)));
    })));
}

/* Senior questions */
if (has(L.seniorQuestions)) {
  section("questions", "Senior questions", h("div", null,
    h("p", { class: "lead" }, "Answer in your head first, then open."),
    L.seniorQuestions.map((q) => h("details", { class: "q" }, text("summary", q.q), text("p", q.a)))));
}

/* Resources */
if (has(L.resources)) {
  section("resources", "Go deeper", h("ul", { class: "resources" }, L.resources.map((r) => h("li", null,
    h("a", { href: r.url, target: "_blank", rel: "noopener noreferrer", dir: "auto" }, r.title),
    r.kind ? h("span", { class: "kind" }, r.kind) : null))));
}

const when = L.generatedAt ? new Date(L.generatedAt).toLocaleString() : "";
app.append(h("footer", null, `Generated by learn${when ? " on " + when : ""}.`));

/* Section pills with the current section marked, plus a reading progress bar */
const toc = document.getElementById("toc");
const nav = toc.parentElement;
const links = new Map();
for (const s of sections) {
  const a = h("a", { href: "#" + s.id }, s.title);
  links.set(s.id, a);
  toc.append(h("li", null, a));
}
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) {
    links.forEach((a) => a.classList.remove("active"));
    const a = links.get(e.target.id);
    if (!a) continue;
    a.classList.add("active");
    nav.scrollTo?.({ left: a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2 });
  }
}, { rootMargin: "-20% 0px -70% 0px" });
sections.forEach((s) => io.observe(document.getElementById(s.id)));

const bar = document.getElementById("progress");
function updateProgress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? Math.min(100, (scrollY / max) * 100) : 100) + "%";
}
addEventListener("scroll", updateProgress, { passive: true });
updateProgress();

/* Diagrams: Mermaid themed from the page tokens, re-rendered on theme change */
let mermaid;
let seq = 0;
async function renderDiagrams() {
  const nodes = document.querySelectorAll(".mm[data-src]");
  if (!nodes.length) return;
  try {
    mermaid ??= (await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs")).default;
  } catch {
    nodes.forEach((n) => n.replaceChildren(h("div", { class: "mm-error" }, "Diagrams need an internet connection to load Mermaid. Source:", h("pre", null, n.dataset.src))));
    return;
  }
  const css = getComputedStyle(document.documentElement);
  const v = (name) => css.getPropertyValue(name).trim();
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: "base",
    fontFamily: v("--sans"),
    themeVariables: {
      background: v("--sheet"),
      primaryColor: v("--paper"),
      primaryBorderColor: v("--line"),
      primaryTextColor: v("--ink"),
      secondaryColor: v("--sheet"),
      tertiaryColor: v("--paper"),
      lineColor: v("--line"),
      textColor: v("--ink"),
      noteBkgColor: v("--mark"),
      noteTextColor: v("--mark-ink"),
      actorBkg: v("--paper"),
      actorBorder: v("--line"),
      actorTextColor: v("--ink"),
      signalColor: v("--ink"),
      signalTextColor: v("--ink"),
      labelBoxBkgColor: v("--paper"),
      edgeLabelBackground: v("--sheet"),
      fontSize: "15px",
    },
  });
  for (const n of nodes) {
    try {
      const { svg } = await mermaid.render("mm" + ++seq, n.dataset.src);
      n.innerHTML = svg; // Mermaid output, sanitized by securityLevel "strict"
    } catch (e) {
      n.replaceChildren(h("div", { class: "mm-error" }, "This diagram has a syntax error: " + (e?.message || e), h("pre", null, n.dataset.src)));
      document.getElementById("dmm" + seq)?.remove();
    }
  }
}
renderDiagrams();
</script>
</body>
</html>
