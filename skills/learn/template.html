<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F6F1;
  --sheet: #FBFCF9;
  --ink: #1D2530;
  --muted: #5D6672;
  --rule: #D8DDD3;
  --mark: #F5DC4E;
  --mark-ink: #1D2530;
  --line: #2F6F73;
  --good: #2E7D4F;
  --bad: #B23A3A;
  --measure: 42rem;
  --wide: 60rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14181D; --sheet: #1A1F25; --ink: #E5E8EC; --muted: #97A0AB; --rule: #2A3038;
    --mark: #8A7714; --mark-ink: #FFF8D6; --line: #6FB7BA; --good: #6CC58F; --bad: #EE8A8A;
  }
}
:root[data-theme="dark"] {
  --paper: #14181D; --sheet: #1A1F25; --ink: #E5E8EC; --muted: #97A0AB; --rule: #2A3038;
  --mark: #8A7714; --mark-ink: #FFF8D6; --line: #6FB7BA; --good: #6CC58F; --bad: #EE8A8A;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.0625rem/1.7 "Literata", Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .82em; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; border-radius: 2px; }

/* The highlighter: the one loud thing on the page. */
mark, .hl {
  background: linear-gradient(104deg, transparent .3em, var(--mark) .3em, var(--mark) calc(100% - .25em), transparent calc(100% - .25em)) 0 62% / 100% 58% no-repeat;
  color: inherit;
  padding: 0 .15em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark, :root:not([data-theme="light"]) .hl { color: var(--mark-ink); } }
:root[data-theme="dark"] mark, :root[data-theme="dark"] .hl { color: var(--mark-ink); }

.layout {
  display: grid;
  grid-template-columns: 13rem minmax(0, 1fr);
  gap: 3.5rem;
  max-width: calc(var(--wide) + 16.5rem);
  margin: 0 auto;
  padding: 3rem 1.5rem 6rem;
}
nav.toc { position: sticky; top: 2rem; align-self: start; font-size: .9rem; }
nav.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: ch; }
nav.toc li { counter-increment: ch; }
nav.toc ol a {
  display: grid; grid-template-columns: 1.6rem 1fr; padding: .3rem 0;
  color: var(--muted); text-decoration: none;
}
nav.toc ol a::before { content: counter(ch); font-family: "JetBrains Mono", monospace; font-size: .8em; padding-top: .15em; }
nav.toc a:hover, nav.toc a.active { color: var(--ink); }
nav.toc a.active span { background: linear-gradient(var(--mark), var(--mark)) 0 85% / 100% .35em no-repeat; }
nav.toc .home { display: block; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); }
#theme { margin-top: .75rem; background: none; border: 1px solid var(--rule); color: var(--muted); font: inherit; font-size: .85rem; padding: .25rem .6rem; border-radius: 4px; cursor: pointer; }

main { min-width: 0; }
main > section, main > header { max-width: var(--measure); }
main > section.wide { max-width: var(--wide); }

header.hero { padding-bottom: 2.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--rule); }
.hero h1 {
  font-weight: 800; font-size: clamp(2.3rem, 5.5vw, 3.8rem); line-height: 1.04;
  letter-spacing: -.02em; margin: 0 0 1.75rem; text-wrap: balance;
}
.tldr { font-size: 1.28rem; line-height: 1.55; margin: 0; padding: 0; list-style: none; }
.tldr li + li { margin-top: .5rem; }
.tldr li:first-child { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin-top: 1.75rem; color: var(--muted); font-size: .92rem; }
.meta b { color: var(--ink); font-weight: 600; }

section { padding: 2.75rem 0 1rem; }
h2 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 1.1rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.2rem; margin: 2rem 0 .5rem; line-height: 1.3; }
p { margin: 0 0 1rem; }
.lead { color: var(--muted); margin-top: -.4rem; }

blockquote.pitch {
  margin: 0; padding: 1.25rem 1.5rem; background: var(--sheet);
  border-left: 4px solid var(--mark); font-style: italic; font-size: 1.12rem;
}

.files { list-style: none; padding: 0; margin: 0; }
.files li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: .4rem; padding: .45rem 0; border-top: 1px solid var(--rule); }
.files .sign { font-family: "JetBrains Mono", monospace; font-weight: 600; text-align: center; }
.files .added { color: var(--good); } .files .deleted { color: var(--bad); } .files .modified { color: var(--muted); }
.files .path { word-break: break-all; }
.files .role { display: block; color: var(--muted); font-size: .92rem; }

figure.diagram {
  margin: 0 0 1.25rem; padding: 1.5rem; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto;
}
figure.diagram .mm { display: flex; justify-content: center; min-height: 3rem; }
figure.diagram svg { max-width: 100%; height: auto; }
figure.diagram figcaption { margin-top: 1rem; font-size: .9rem; color: var(--muted); }
.mm-error { font-size: .85rem; color: var(--bad); }
.mm-error pre { color: var(--ink); white-space: pre-wrap; background: var(--paper); padding: .75rem; border-radius: 4px; }

ol.steps { padding-left: 1.4rem; margin: 0 0 1rem; }
ol.steps li { padding-left: .3rem; margin-bottom: .35rem; }
ul.notes { padding-left: 1.2rem; }

.pattern { padding: 1.5rem 0; border-top: 1px solid var(--rule); }
.pattern:first-of-type { border-top: 0; padding-top: .25rem; }
.pattern h3 { margin: 0 0 .1rem; font-size: 1.35rem; }
.pattern .cat { color: var(--muted); font-size: .9rem; margin-bottom: .9rem; }
.pattern .label { font-weight: 600; }
.where { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 1rem; }
.where a, .where span {
  font-family: "JetBrains Mono", monospace; font-size: .78rem; padding: .2rem .5rem;
  border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); text-decoration: none; word-break: break-all;
}
.where a:hover { border-color: var(--line); }
.tradeoffs { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; font-size: .95rem; }
.tradeoffs h4 { margin: 0 0 .3rem; font-size: .95rem; }
.tradeoffs ul { margin: 0; padding-left: 1.1rem; }
.tradeoffs .gain h4 { color: var(--good); } .tradeoffs .cost h4 { color: var(--bad); }

table { width: 100%; border-collapse: collapse; font-size: .95rem; margin-bottom: 1rem; }
th, td { text-align: left; padding: .55rem .6rem .55rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .88rem; }
.table-wrap { overflow-x: auto; }

dl.concepts { margin: 0; }
dl.concepts dt { font-weight: 700; margin-top: 1.1rem; }
dl.concepts dd { margin: .15rem 0 0; }

details.q { border-top: 1px solid var(--rule); padding: .8rem 0; }
details.q summary { cursor: pointer; font-weight: 600; list-style-position: outside; }
details.q p { margin: .6rem 0 0; }

.quiz-item { margin-bottom: 2rem; }
.quiz-item .qtext { font-weight: 600; margin-bottom: .6rem; }
.quiz-item .opts { display: grid; gap: .45rem; }
.quiz-item button.opt {
  text-align: left; font: inherit; font-size: .98rem; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: .65rem .9rem; cursor: pointer;
}
.quiz-item button.opt:hover:not(:disabled) { border-color: var(--line); }
.quiz-item button.opt:disabled { cursor: default; }
.quiz-item button.opt.right { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.quiz-item button.opt.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.quiz-item .why { margin-top: .6rem; font-size: .95rem; }
.score { color: var(--muted); font-size: .95rem; }

ul.resources { list-style: none; padding: 0; margin: 0; }
ul.resources li { padding: .6rem 0; border-top: 1px solid var(--rule); }
ul.resources a { font-weight: 600; }
ul.resources .kind { color: var(--muted); font-size: .88rem; margin-left: .5rem; }

footer { margin-top: 4rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .88rem; max-width: var(--measure); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 1.5rem 1rem 4rem; }
  nav.toc { position: static; margin-bottom: 2rem; }
  nav.toc ol { display: flex; flex-wrap: wrap; gap: .1rem 1rem; }
  nav.toc ol a { display: inline-flex; gap: .35rem; }
  nav.toc .home { display: inline-block; margin-right: 1rem; }
  .tradeoffs { grid-template-columns: 1fr; gap: .75rem; }
  figure.diagram { padding: 1rem .75rem; }
  /* Keep diagrams legible on phones: natural size, scroll sideways inside the frame */
  figure.diagram .mm { justify-content: flex-start; }
  figure.diagram svg { max-width: none !important; min-width: 36rem; }
}
@media print {
  nav.toc { display: none; } .layout { display: block; }
  figure.diagram, .pattern { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Lesson sections">
    <ol id="toc"></ol>
    <a class="home" href="index.html">All lessons</a>
    <button id="theme" type="button">Theme: auto</button>
  </nav>
  <main id="app"></main>
</div>

<script id="lesson-data" type="application/json">/*__LEARN_DATA__*/null</script>
<script type="module">
const raw = document.getElementById("lesson-data").textContent;
const L = JSON.parse(raw === "/*__LEARN_DATA__*/null" ? "null" : raw);
const app = document.getElementById("app");

// Every piece of lesson text goes through textContent. Nothing from the JSON is parsed as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const has = (a) => Array.isArray(a) && a.length > 0;
const text = (tag, s, attrs) => h(tag, { dir: "auto", ...(attrs || {}) }, s);

// Theme toggle: auto -> light -> dark. Stored per viewer, page works without it.
const themeBtn = document.getElementById("theme");
const modes = ["auto", "light", "dark"];
function applyTheme(m) {
  if (m === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", m);
  themeBtn.textContent = "Theme: " + m;
}
let theme = "auto";
try { theme = localStorage.getItem("learn-theme") || "auto"; } catch {}
applyTheme(theme);
themeBtn.addEventListener("click", () => {
  theme = modes[(modes.indexOf(theme) + 1) % modes.length];
  try { localStorage.setItem("learn-theme", theme); } catch {}
  applyTheme(theme);
  renderDiagrams();
});

if (!L) {
  app.append(h("header", { class: "hero" }, h("h1", null, "No lesson data"),
    h("p", null, "This is the raw template. Run /learn in Claude Code, or node render.mjs <lesson.json>, to generate a lesson.")));
  throw new Error("no lesson data");
}

document.title = L.title;
const sections = [];
function section(id, title, body, opts = {}) {
  if (!body) return;
  sections.push({ id, title });
  app.append(h("section", { id, class: opts.wide ? "wide" : null }, h("h2", null, title), body));
}

function diagram(src, caption) {
  if (!src) return null;
  return h("figure", { class: "diagram" },
    h("div", { class: "mm", "data-src": src }),
    caption ? text("figcaption", caption) : null);
}

function editorLink(ref) {
  const m = /^(.*?)(?::(\d+))?$/.exec(ref);
  if (!L.root || !m) return h("span", null, ref);
  const path = m[1].replace(/\\/g, "/").replace(/^\.?\//, "");
  const href = "vscode://file/" + encodeURI(L.root + "/" + path) + (m[2] ? ":" + m[2] : "");
  return h("a", { href, title: "Open in VS Code" }, ref);
}

/* Hero */
const metaBits = [];
if (L.level) metaBits.push(h("span", null, "Level ", h("b", null, L.level)));
if (has(L.files)) metaBits.push(h("span", null, h("b", null, L.files.length), " files"));
if (has(L.patterns)) metaBits.push(h("span", null, h("b", null, L.patterns.length), " patterns"));
if (has(L.stack)) metaBits.push(h("span", null, "Built with ", h("b", null, L.stack.join(", "))));
app.append(h("header", { class: "hero", id: "top" },
  text("h1", L.title),
  h("ul", { class: "tldr" }, L.tldr.map((t) => text("li", t))),
  metaBits.length ? h("div", { class: "meta" }, metaBits) : null));

/* What you built */
if (L.pitch || has(L.files)) {
  section("built", "What you built", h("div", null,
    L.pitch ? h("div", null, h("p", { class: "lead" }, "Say it like this in a standup or interview:"),
      text("blockquote", L.pitch, { class: "pitch" })) : null,
    has(L.files) ? h("div", null, h("h3", null, "Files that carry the change"),
      h("ul", { class: "files" }, L.files.map((f) => {
        const c = ["added", "deleted"].includes(f.change) ? f.change : "modified";
        return h("li", null,
          h("span", { class: "sign " + c, "aria-label": c }, c === "added" ? "+" : c === "deleted" ? "x" : "~"),
          h("div", null, h("span", { class: "path mono" }, f.path), f.role ? text("span", f.role, { class: "role" }) : null));
      }))) : null));
}

/* Architecture */
if (L.architecture?.mermaid) {
  section("architecture", "Architecture", h("div", null,
    h("p", { class: "lead" }, "The moving parts and how they talk to each other."),
    diagram(L.architecture.mermaid),
    has(L.architecture.notes) ? h("ul", { class: "notes" }, L.architecture.notes.map((n) => text("li", n))) : null), { wide: true });
}

/* Flows */
if (has(L.flows)) {
  section("flows", "How a request moves", h("div", null, L.flows.map((f) => h("div", null,
    text("h3", f.name),
    diagram(f.mermaid),
    has(f.steps) ? h("ol", { class: "steps" }, f.steps.map((s) => text("li", s))) : null))), { wide: true });
}

/* Patterns */
if (has(L.patterns)) {
  section("patterns", "Patterns you used", h("div", null, L.patterns.map((p) => h("article", { class: "pattern" },
    h("h3", { dir: "auto" }, h("mark", null, p.name)),
    p.category ? text("div", p.category, { class: "cat" }) : null,
    p.what ? h("p", { dir: "auto" }, h("span", { class: "label" }, "The idea. "), p.what) : null,
    p.here ? h("p", { dir: "auto" }, h("span", { class: "label" }, "In your code. "), p.here) : null,
    has(p.where) ? h("div", { class: "where" }, p.where.map(editorLink)) : null,
    p.tradeoffs && (has(p.tradeoffs.pros) || has(p.tradeoffs.cons)) ? h("div", { class: "tradeoffs" },
      has(p.tradeoffs.pros) ? h("div", { class: "gain" }, h("h4", null, "What you gain"), h("ul", null, p.tradeoffs.pros.map((x) => text("li", x)))) : null,
      has(p.tradeoffs.cons) ? h("div", { class: "cost" }, h("h4", null, "What it costs"), h("ul", null, p.tradeoffs.cons.map((x) => text("li", x)))) : null) : null))));
}

/* Data and cache */
const D = L.data;
if (D && (D.erMermaid || has(D.tables) || has(D.cache))) {
  section("data", "Data and cache", h("div", null,
    D.erMermaid ? diagram(D.erMermaid) : null,
    has(D.tables) ? h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Table"), h("th", null, "Why it exists"))),
      h("tbody", null, D.tables.map((t) => h("tr", null, h("td", { class: "mono" }, t.name), text("td", t.why || "")))))) : null,
    has(D.cache) ? h("div", null, h("h3", null, "Cache"), h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Key"), h("th", null, "TTL"), h("th", null, "Strategy"), h("th", null, "Why"))),
      h("tbody", null, D.cache.map((c) => h("tr", null,
        h("td", { class: "mono" }, c.key), h("td", null, c.ttl || ""), h("td", null, c.strategy || ""), text("td", c.why || ""))))))) : null), { wide: true });
}

/* Concepts */
if (has(L.concepts)) {
  section("concepts", "Words to know", h("dl", { class: "concepts" }, L.concepts.map((c) => [
    h("dt", { dir: "auto" }, h("mark", null, c.term)), text("dd", c.explain)])));
}

/* Senior questions */
if (has(L.seniorQuestions)) {
  section("questions", "What a senior would ask", h("div", null,
    h("p", { class: "lead" }, "Try answering before you open each one."),
    L.seniorQuestions.map((q) => h("details", { class: "q" }, text("summary", q.q), text("p", q.a)))));
}

/* Quiz */
if (has(L.quiz)) {
  let right = 0, answered = 0;
  const score = h("p", { class: "score", "aria-live": "polite" }, `0 of ${L.quiz.length} answered`);
  const items = L.quiz.map((q, qi) => {
    const why = h("p", { class: "why", hidden: true, dir: "auto" });
    const buttons = q.options.map((o, oi) => h("button", { class: "opt", type: "button", dir: "auto", onclick: () => {
      buttons.forEach((b, bi) => {
        b.disabled = true;
        if (bi === q.answer) b.classList.add("right");
      });
      const ok = oi === q.answer;
      if (!ok) buttons[oi].classList.add("wrong");
      answered++; if (ok) right++;
      why.hidden = false;
      why.textContent = (ok ? "Correct. " : "Not quite. ") + (q.why || "");
      score.textContent = answered === L.quiz.length
        ? `You got ${right} of ${L.quiz.length}.`
        : `${answered} of ${L.quiz.length} answered`;
    } }, o));
    return h("div", { class: "quiz-item" }, text("div", `${qi + 1}. ${q.q}`, { class: "qtext" }), h("div", { class: "opts" }, buttons), why);
  });
  section("quiz", "Check yourself", h("div", null, items, score));
}

/* Resources */
if (has(L.resources)) {
  section("resources", "Go deeper", h("ul", { class: "resources" }, L.resources.map((r) => h("li", null,
    h("a", { href: r.url, target: "_blank", rel: "noopener noreferrer", dir: "auto" }, r.title),
    r.kind ? h("span", { class: "kind" }, r.kind) : null))));
}

const when = L.generatedAt ? new Date(L.generatedAt).toLocaleString() : "";
app.append(h("footer", null, `Generated by learn${when ? " on " + when : ""}.`));

/* Table of contents with the current section marked */
const toc = document.getElementById("toc");
const links = new Map();
for (const s of sections) {
  const a = h("a", { href: "#" + s.id }, h("span", null, s.title));
  links.set(s.id, a);
  toc.append(h("li", null, a));
}
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) {
    links.forEach((a) => a.classList.remove("active"));
    links.get(e.target.id)?.classList.add("active");
  }
}, { rootMargin: "-20% 0px -70% 0px" });
sections.forEach((s) => io.observe(document.getElementById(s.id)));

/* Diagrams: Mermaid themed from the page tokens, re-rendered on theme change */
let mermaid;
let seq = 0;
async function renderDiagrams() {
  const nodes = document.querySelectorAll(".mm[data-src]");
  if (!nodes.length) return;
  try {
    mermaid ??= (await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs")).default;
  } catch {
    nodes.forEach((n) => n.replaceChildren(h("div", { class: "mm-error" }, "Diagrams need an internet connection to load Mermaid. Source:", h("pre", null, n.dataset.src))));
    return;
  }
  const css = getComputedStyle(document.documentElement);
  const v = (name) => css.getPropertyValue(name).trim();
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: "base",
    fontFamily: "Literata, Georgia, serif",
    themeVariables: {
      background: v("--sheet"),
      primaryColor: v("--paper"),
      primaryBorderColor: v("--line"),
      primaryTextColor: v("--ink"),
      secondaryColor: v("--sheet"),
      tertiaryColor: v("--paper"),
      lineColor: v("--line"),
      textColor: v("--ink"),
      noteBkgColor: v("--mark"),
      noteTextColor: v("--mark-ink"),
      actorBkg: v("--paper"),
      actorBorder: v("--line"),
      actorTextColor: v("--ink"),
      signalColor: v("--ink"),
      signalTextColor: v("--ink"),
      labelBoxBkgColor: v("--paper"),
      edgeLabelBackground: v("--sheet"),
      fontSize: "15px",
    },
  });
  for (const n of nodes) {
    try {
      const { svg } = await mermaid.render("mm" + ++seq, n.dataset.src);
      n.innerHTML = svg; // Mermaid output, sanitized by securityLevel "strict"
    } catch (e) {
